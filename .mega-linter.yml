ENABLE:
  - ACTION
  - DOCKERFILE
  - JSON
  - MARKDOWN
  - REPOSITORY
  - SPELL
  - YAML
DISABLE_LINTERS:
  - REPOSITORY_DEVSKIM
  - REPOSITORY_DUSTILOCK
  - REPOSITORY_KICS
  - REPOSITORY_SEMGREP
  - JSON_JSONLINT
  - SPELL_CSPELL
# These linters depend on external state that changes independently of a
# pull request (reachability of links, newly published CVEs), so they are
# reported but do not fail the build. Otherwise every open pull request turns
# red at once whenever a new advisory is published for any locked dependency.
# Vulnerability findings are still uploaded as SARIF to code scanning, and
# critical vulnerabilities still block pull requests through the dependency
# review in continuous-integration.yml.
DISABLE_ERRORS_LINTERS:
  - REPOSITORY_GRYPE
  - REPOSITORY_OSV_SCANNER
  - REPOSITORY_TRIVY
  - SPELL_LYCHEE
SARIF_REPORTER: true
PRINT_ALPACA: false
SHOW_SKIPPED_LINTERS: false
SPELL_LYCHEE_FILE_EXTENSIONS:
  [".feature", ".json", ".md", ".md.j2", ".txt", ".yaml", ".yml"]
DOCKERFILE_HADOLINT_FILTER_REGEX_EXCLUDE: (templates)
FILTER_REGEX_EXCLUDE: (CHANGELOG.md|package-lock.json)
# tasks.json is wrongfully matched against another schema,
# and schemas for .vscode/[tasks.json|launch.json] are built
# dynamically based upon context (e.g. installed extensions)
# hence the exclusion
JSON_V8R_FILTER_REGEX_EXCLUDE: (\.vscode)
REPOSITORY_TRIVY_ARGUMENTS: --ignorefile .github/linters/.trivyignore.yml
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
