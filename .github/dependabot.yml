---
version: 2

updates:
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    cooldown:
      default-days: 7
    directories:
      - .devcontainer/base
      - .devcontainer/cpp
      - .devcontainer/rust
    schedule:
      interval: monthly
  - package-ecosystem: devcontainers
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "test(deps)"
  # Node.js tooling installed in the base image (mermaid-cli and the
  # puppeteer-managed headless Chrome used for documentation builds).
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: .devcontainer/base
    schedule:
      interval: monthly
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directory: .devcontainer
    schedule:
      interval: monthly
  # Tooling used by the document generation workflow. Keeping it in a
  # Dependabot-managed lock file prevents pinned versions from silently
  # disappearing from PyPI and breaking every pull request.
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directory: docs
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
